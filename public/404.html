<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>404 | onekarlo.com</title>
  <style>
    :root { color-scheme: dark; background: #070a12; color: #f8fafc; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 2rem; background: radial-gradient(circle at 80% 10%, rgba(16,185,129,.13), transparent 42%), #070a12; }
    main { width: min(100%, 42rem); border: 1px solid rgba(255,255,255,.12); border-radius: 1rem; padding: clamp(1.5rem, 5vw, 3rem); background: #0d121f; box-shadow: 0 24px 70px rgba(0,0,0,.4); }
    .mark { color: #10b981; letter-spacing: .08em; font-size: .8rem; }
    h1 { margin: 1rem 0 .75rem; font-family: Arial, Helvetica, sans-serif; font-size: clamp(2.4rem, 8vw, 4.5rem); line-height: 1; }
    p { max-width: 34rem; color: #94a3b8; line-height: 1.7; }
    a { display: inline-flex; margin-top: 1rem; padding: .7rem 1rem; border-radius: .5rem; background: #10b981; color: #040812; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 2px solid #f8fafc; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">onekarlo.com / 404</div>
    <h1>Route not found.</h1>
    <p>That route is not available. Return to the home page to continue exploring the portfolio.</p>
    <a href="/#hero">Return to the home page</a>
  </main>
</body>
</html>
